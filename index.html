<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B120C">
<title>Bhukkad Point – App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ink:#2B120C;--ink2:#3D1A11;--haldi:#FFB400;--mirch:#D62E1F;--veg:#1E9E4A;--wa:#1FA855;
--bg:#FFF5DF;--card:#FFFBF0;--fg:#2B120C;--muted:#7A5F52;--line:#ECDDBE;--soft:#FBEACB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D0C08;--card:#2C130C;--fg:#FFF1D6;--muted:#C4A493;--line:#472619;--soft:#3A1A10}}
:root[data-theme="dark"]{--bg:#1D0C08;--card:#2C130C;--fg:#FFF1D6;--muted:#C4A493;--line:#472619;--soft:#3A1A10}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ink)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font-family:'DM Sans',system-ui,-apple-system,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;margin:0;letter-spacing:-.02em;line-height:1.05}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--haldi);outline-offset:2px}
img{max-width:100%;display:block}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));overflow-x:hidden}

/* ---------- home top ---------- */
.top{background:var(--ink);color:#FFF1D6;padding:14px 18px 58px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.top::after{content:"🍜";position:absolute;right:-18px;bottom:-26px;font-size:130px;opacity:.16;transform:rotate(-14deg)}
.tr{display:flex;align-items:center;gap:10px}
.logo{width:52px;height:52px;border-radius:50%;flex:none;overflow:hidden;box-shadow:0 0 0 2px var(--haldi)}.logo img{width:100%;height:100%}
.brand{flex:1;min-width:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:23px;line-height:1;letter-spacing:-.02em}.brand small{display:block;font-family:'DM Sans',sans-serif;font-weight:500;font-size:11.5px;color:#E9CFB4;margin-top:4px;letter-spacing:0}
.locp{display:flex;align-items:center;gap:6px;margin-top:14px;background:var(--ink2);border-radius:99px;padding:8px 14px;font-size:13px;max-width:100%;color:#FFF1D6}.locp b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.locb{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;line-height:1.2}
.locb small{color:#E9CFB4;font-size:12px}
.locb b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.av{width:42px;height:42px;border-radius:14px;background:var(--ink2);font-size:19px;display:grid;place-items:center;flex:none}
.top h1{font-size:40px;font-weight:800;margin-top:18px;max-width:300px}
.top h1 span{color:var(--haldi);display:block}
.top p{margin:8px 0 0;color:#E9CFB4;font-size:14px}
.srch{display:flex;align-items:center;gap:10px;margin:-26px 18px 0;position:relative;z-index:2;background:var(--card);border:1px solid var(--line);border-radius:16px;height:52px;padding:0 16px;box-shadow:0 12px 26px -16px rgba(43,18,12,.55)}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--fg);font-size:15px}

/* ---------- sections ---------- */
.sh{display:flex;justify-content:space-between;align-items:end;gap:10px;padding:0 18px;margin:26px 0 12px}
.sh h2{font-size:22px;font-weight:800}
.sh button{color:var(--mirch);font-weight:700;font-size:14px}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 18px 6px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs>*{scroll-snap-align:start;flex:none}

.bn{width:86%;border-radius:22px;padding:18px 18px 16px;min-height:132px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.bn h3{font-size:26px;font-weight:800;max-width:70%}
.bn p{margin:4px 0 0;font-size:13px;max-width:64%}
.bn i{font-style:normal;position:absolute;right:10px;bottom:-6px;font-size:76px;transform:rotate(-8deg)}
.bn .pill{align-self:flex-start;margin-top:12px;font-weight:700;font-size:13px;padding:6px 12px;border-radius:99px}
.bimg{width:86%;padding:0;border-radius:22px;overflow:hidden;aspect-ratio:694/360;background:var(--ink2)}.bimg img{width:100%;height:100%;object-fit:cover}
.b1{background:var(--haldi);color:var(--ink)}.b1 .pill{background:var(--ink);color:#FFF1D6}
.b2{background:var(--mirch);color:#fff}.b2 .pill{background:#fff;color:var(--mirch)}
.b3{background:var(--ink2);color:#FFF1D6}.b3 .pill{background:var(--haldi);color:var(--ink)}

.cat{width:74px;text-align:center}
.cat .ci{width:66px;height:66px;margin:0 auto 6px;border-radius:22px 22px 22px 6px;display:grid;place-items:center;font-size:32px}
.cat span{font-size:12.5px;font-weight:700}

/* popular cards */
.hc{width:158px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.hc .pic{height:128px;font-size:58px}
.hc .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.hc h3{font-size:15.5px;font-weight:800;line-height:1.12}
.pr{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.price{font-weight:700;font-size:16px}
.rt{font-size:12px;font-weight:700;color:var(--veg)}

.pic{position:relative;display:grid;place-items:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pic>span{filter:drop-shadow(0 8px 6px rgba(43,18,12,.28))}
.tag{position:absolute;left:8px;top:8px;z-index:1;background:var(--ink);color:var(--haldi);font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px}
.vn{display:inline-grid;place-items:center;width:15px;height:15px;border:1.6px solid var(--veg);border-radius:3px;background:#fff;flex:none;vertical-align:-2px}
.vn::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--veg)}
.vn.nv{border-color:var(--mirch)}.vn.nv::after{background:var(--mirch);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.pic .vn{position:absolute;right:8px;top:8px;z-index:1}

/* list rows */
.list{padding:0 18px;display:grid;gap:12px}
.li{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;text-align:left;width:100%}
.li .pic{width:100px;height:100px;border-radius:15px;font-size:50px;flex:none}
.li .in{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.li h3{font-size:16.5px;font-weight:800;line-height:1.12}
.li p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* add controls */
.add{border:2px solid var(--mirch);color:var(--mirch);font-weight:800;border-radius:11px;height:34px;min-width:74px;padding:0 12px;font-size:14px;background:var(--card)}
.add:active{transform:scale(.93)}
.step{display:inline-flex;align-items:center;justify-content:space-between;background:var(--mirch);color:#fff;border-radius:11px;height:34px;min-width:84px;font-weight:800;animation:pop .22s}
.step button{width:30px;height:34px;font-size:18px;color:#fff}
@keyframes pop{from{transform:scale(.85)}to{transform:none}}

.why{display:flex;gap:10px;padding:0 18px;overflow-x:auto;scrollbar-width:none}
.why::-webkit-scrollbar{display:none}
.why div{flex:none;background:var(--soft);border-radius:16px;padding:12px 14px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center}
.foot{text-align:center;color:var(--muted);font-size:13px;margin:34px 18px 0}
.foot img{width:84px;height:84px;margin:0 auto 10px;border-radius:50%}.foot b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:20px;color:var(--fg)}

/* ---------- inner screens ---------- */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:16px 18px 10px;display:flex;align-items:center;gap:12px}
.hd h1{font-size:28px;font-weight:800;flex:1}
.back{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 18px 10px;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:4;background:var(--bg)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:#FFF1D6;border-color:var(--ink)}
.msrch{margin:0 18px 12px}
.msrch .srch{margin:0;box-shadow:none;height:46px}
.sec h2{font-size:19px;font-weight:800;padding:16px 18px 10px;display:flex;align-items:center;gap:8px}
.empty{text-align:center;padding:40px 24px;color:var(--muted)}
.empty div{font-size:70px}
.empty h3{color:var(--fg);font-size:22px;margin:10px 0 6px}

.cp{display:flex;gap:10px;align-items:center;background:var(--card);border:1.5px dashed var(--mirch);border-radius:16px;padding:14px;font-size:14px}
.cp .ic{font-size:28px}
.cp b{font-size:15px}
.cp button{margin-left:auto;font-weight:800;color:var(--mirch);flex:none}
.pad{padding:0 18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ln:last-child{border:0}
.ln .vn{margin-right:6px}
.ln small{display:block;color:var(--muted)}
.tot{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted);font-size:14px}
.tot.g{color:var(--fg);font-weight:800;font-size:19px;padding-top:10px;border-top:1px solid var(--line);margin-top:6px}
.fld{display:block;margin-top:12px;font-size:13px;font-weight:700}
.fld input,.fld textarea{display:block;width:100%;margin-top:5px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical}
.err{color:var(--mirch);font-size:13px;font-weight:700;min-height:18px;margin-top:8px}
.btn{display:block;width:100%;text-align:center;font-weight:800;padding:15px;border-radius:15px;font-size:16px}
.btn.p{background:var(--haldi);color:var(--ink);box-shadow:0 5px 0 #B57F00}
.btn.p:active{transform:translateY(3px);box-shadow:0 2px 0 #B57F00}
.btn.wa{background:var(--wa);color:#fff;margin-top:6px}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.prof .bigav{width:64px;height:64px;border-radius:22px;background:var(--haldi);display:grid;place-items:center;font-size:30px;color:var(--ink);font-weight:800;font-family:'Bricolage Grotesque',sans-serif}
.links a{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-weight:500}
.links a:last-child{border:0}
.gap{height:14px}

/* ---------- cart bar + nav ---------- */
.cbar{position:fixed;left:50%;transform:translate(-50%,160%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:calc(min(460px,100%) - 24px);z-index:30;background:var(--mirch);color:#fff;border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;box-shadow:0 14px 30px -8px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.9,.3,1.1)}
.cbar.show{transform:translate(-50%,0)}
.cbar small{display:block;font-weight:500;font-size:12px;opacity:.9}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(460px,100%);z-index:31;background:var(--ink);color:#C9A894;display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;position:relative;padding:4px 0}
.nav button i{font-style:normal;font-size:21px;line-height:1;filter:grayscale(1);opacity:.75;transition:transform .2s}
.nav button.on{color:var(--haldi)}
.nav button.on i{filter:none;opacity:1;transform:translateY(-2px)}
.nb{position:absolute;top:0;left:calc(50% + 6px);background:var(--mirch);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

/* ---------- item sheet ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(20,8,4,.6);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:460px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));animation:sl .3s cubic-bezier(.2,.9,.3,1)}
@keyframes sl{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.sheet .pic{height:240px;font-size:120px;border-radius:26px 26px 0 0}
.sheet .x{position:absolute;right:12px;top:12px;z-index:2;width:38px;height:38px;border-radius:50%;background:rgba(43,18,12,.75);color:#fff;font-size:16px}
.sheet .bd{padding:18px}
.sheet h2{font-size:26px;font-weight:800;margin:6px 0 6px}
.sheet p{color:var(--muted);margin:0 0 16px}
.sheet .pr .price{font-size:22px}
.sheet .add,.sheet .step{height:44px;min-width:120px;font-size:16px}
.sheet .step button{width:40px;height:44px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"><main id="screen"></main></div>

<button class="cbar" id="cbar" data-go="cart" aria-label="View cart"><span><span id="cbN"></span><small id="cbP"></small></span><span>View cart 🛒</span></button>

<nav class="nav" id="nav" aria-label="Main">
  <button data-go="home"><i>🏠</i>Home</button>
  <button data-go="menu"><i>📖</i>Menu</button>
  <button data-go="offers"><i>🏷️</i>Offers</button>
  <button data-go="cart"><i>🛒</i>Cart<span class="nb" id="nb" hidden>0</span></button>
  <button data-go="profile"><i>👤</i>Profile</button>
</nav>

<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

const cart={};let tab='home',query='',mquery='',coupon=false,sheetItem=null;

const saveMe=()=>{try{localStorage.setItem('bp_me',JSON.stringify(me))}catch(e){}};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId=id=>MENU.find(m=>m.id==id);

const count=()=>MENU.reduce((s,m)=>s+(cart[m.id]||0),0);

/* ---------- COMPONENTS ---------- */
const vn=it=>`<i class="vn${it.veg?'':' nv'}" title="${it.veg?'Veg':'Non-veg'}"></i>`;
const pic=(it,extra='')=>`<div class="pic" style="background:${it.bg}">${extra}${it.image?`<img src="${it.image}" alt="${esc(it.name)}" loading="lazy">`:`<span>${it.emoji}</span>`}</div>`;
const ctlInner=it=>{const q=cart[it.id]||0;return q?`<span class="step"><button data-dec="${it.id}" aria-label="Remove one ${esc(it.name)}">−</button><span>${q}</span><button data-inc="${it.id}" aria-label="Add one ${esc(it.name)}">+</button></span>`:`<button class="add" data-inc="${it.id}" aria-label="Add ${esc(it.name)}">ADD</button>`};
const ctl=it=>`<span data-ctl="${it.id}">${ctlInner(it)}</span>`;
const HCard=it=>`<div class="hc" data-open="${it.id}" role="button" tabindex="0">${pic(it,(it.tag?`<span class="tag">${it.tag}</span>`:'')+vn(it))}<div class="bd"><h3>${it.name}</h3><span class="rt">★ ${it.rating}</span><div class="pr"><span class="price">₹${it.price}</span>${ctl(it)}</div></div></div>`;
const Row=it=>`<div class="li" data-open="${it.id}" role="button" tabindex="0">${pic(it,it.tag?`<span class="tag">${it.tag}</span>`:'')}<div class="in"><h3>${vn(it)} ${it.name}</h3><p>${it.desc}</p><span class="rt">★ ${it.rating}</span><div class="pr"><span class="price">₹${it.price}</span>${ctl(it)}</div></div></div>`;
const head=(t,back=true)=>`<div class="hd">${back?`<button class="back" data-go="home" aria-label="Back">←</button>`:''}<h1>${t}</h1></div>`;
const match=(it,q)=>!q||(it.name+' '+it.desc+' '+it.cat).toLowerCase().includes(q);

 <button class="locp" data-go="profile">📍 Deliver to <b>${addr}</b> ▾</button>

function Menu(){

function MenuBody(){
 const secs=CATEGORIES.map(c=>{const its=MENU.filter(m=>m.cat===c.id&&match(m,mquery));return its.length?`<section class="sec" id="sec-${c.id}"><h2>${c.emoji} ${c.name}</h2><div class="list">${its.map(Row).join('')}</div></section>`:''}).join('');
 return secs||`<div class="empty"><div>🤔</div><h3>Nothing matches “${esc(mquery)}”</h3>Try another word.</div>`}

 if(!items.length)return head('Your cart')+`<div class="empty"><div>🛒</div><h3>Your cart is empty</h3><p>Add something tasty from the menu.</p><div class="gap"></div><button class="btn p" data-go="menu">Browse menu</button></div>`;
 const s=sub(),d=coupon&&s>=MINO?OFF:0;
 const cpn=coupon?(s>=MINO?`<div class="cp"><span class="ic">✅</span><div><b>BHUKKAD100 applied</b><br>You save ₹${OFF}</div><button data-unapply>Remove</button></div>`:`<div class="cp"><span class="ic">🏷️</span><div><b>Add ₹${MINO-s} more</b><br>to use BHUKKAD100</div><button data-unapply>Remove</button></div>`):`<div class="cp"><span class="ic">🏷️</span><div><b>BHUKKAD100</b><br>₹${OFF} off above ₹${MINO}</div><button data-apply>Apply</button></div>`;
 return head('Your cart')+`<div class="pad" style="display:grid;gap:12px">
 <div class="box">${items.map(m=>`<div class="ln"><div>${vn(m)}<b>${m.name}</b><small>₹${m.price} each</small></div><div style="display:flex;align-items:center;gap:10px">${ctl(m)}<b>₹${cart[m.id]*m.price}</b></div></div>`).join('')}</div>
 ${cpn}
 <div class="box"><div class="tot"><span>Subtotal</span><span>₹${s}</span></div>${d?`<div class="tot"><span>Offer discount</span><span>−₹${d}</span></div>`:''}<div class="tot g"><span>Total</span><span>₹${s-d}</span></div><div class="tot" style="font-size:12px">Delivery charge, if any, is confirmed on WhatsApp.</div></div>
 <div class="box"><b>Delivery details</b>
 <label class="fld">Name<input id="cn" value="${esc(me.name)}" autocomplete="name"></label>
 <label class="fld">Phone<input id="cph" type="tel" inputmode="tel" value="${esc(me.phone)}" autocomplete="tel"></label>
 <label class="fld">Delivery address<textarea id="ca" rows="2" autocomplete="street-address">${esc(me.address)}</textarea></label>
 <div class="err" id="err"></div>
 <a class="btn wa" id="wa" href="#" target="_blank" rel="noopener">Place order on WhatsApp</a></div></div>`}

function Profile(){
 const ini=me.name?esc(me.name.trim()[0].toUpperCase()):'🙂';
 return head('Profile')+`<div class="pad" style="display:grid;gap:12px">
 <div class="prof"><div class="bigav">${ini}</div><div><h2 style="font-size:22px">${me.name?esc(me.name):'Hello, Bhukkad!'}</h2><span style="color:var(--muted);font-size:14px">${me.phone?esc(me.phone):'Save your details for faster ordering'}</span></div></div>
 <div class="box"><b>Your details</b>
 <label class="fld">Name<input id="pn" value="${esc(me.name)}" autocomplete="name"></label>
 <label class="fld">Phone<input id="pp" type="tel" inputmode="tel" value="${esc(me.phone)}" autocomplete="tel"></label>
 <label class="fld">Delivery address<textarea id="pa" rows="3" autocomplete="street-address">${esc(me.address)}</textarea></label>
 <div class="gap"></div><button class="btn p" data-saveme>Save details</button><div class="err" id="perr"></div></div>
 <div class="box links"><a href="https://wa.me/${WA}" target="_blank" rel="noopener">💬 Chat with us on WhatsApp <span>›</span></a><a href="#">ℹ️ About <span>›</span></a><a href="#">❓ Help <span>›</span></a><a href="#">📄 Terms <span>›</span></a><a href="#">🔒 Privacy <span>›</span></a></div>
 <p style="text-align:center;color:var(--muted);font-size:12px">© 2026 ${BRAND}</p></div>`}

const SCREENS={home:Home,menu:Menu,offers:Offers,cart:Cart,profile:Profile};

/* ---------- RENDER ---------- */
function readCartForm(){if($('#cn')){me.name=$('#cn').value.trim();me.phone=$('#cph').value.trim();me.address=$('#ca').value.trim();saveMe()}}
function go(t,scroll=true){if(tab==='cart')readCartForm();tab=t;$('#screen').innerHTML=SCREENS[t]();if(scroll)window.scrollTo(0,0);
 document.querySelectorAll('#nav [data-go]').forEach(b=>{b.classList.toggle('on',b.dataset.go===t);b.toggleAttribute('aria-current',b.dataset.go===t)});
 bindInputs();updateBars()}
function bindInputs(){
 const q=$('#q');if(q)q.addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();$('#hb').innerHTML=HomeBody()});
 const mq=$('#mq');if(mq)mq.addEventListener('input',e=>{mquery=e.target.value.trim().toLowerCase();$('#mb').innerHTML=MenuBody()});
}
function updateBars(){
 const n=count(),p=sub();
 const nb=$('#nb');nb.hidden=!n;nb.textContent=n;
 $('#cbN').textContent=n+(n===1?' item':' items');$('#cbP').textContent='₹'+p+' total';
 $('#cbar').classList.toggle('show',n>0&&(tab==='home'||tab==='menu'));
}
function changeQty(id,dq){
 cart[id]=Math.max(0,(cart[id]||0)+dq);if(!cart[id])delete cart[id];
 if(tab==='cart'){readCartForm();go('cart',false)}
 else document.querySelectorAll(`[data-ctl="${id}"]`).forEach(el=>el.innerHTML=ctlInner(byId(id)));
 if(sheetItem)renderItem();
 updateBars();
}
function openItem(id){sheetItem=id;renderItem();$('#ov').classList.add('on')}
function renderItem(){const it=byId(sheetItem),q=cart[it.id]||0;
 $('#sheet').innerHTML=`<div style="position:relative"><button class="x" data-close aria-label="Close">✕</button>${pic(it,it.tag?`<span class="tag">${it.tag}</span>`:'')}</div>
 <div class="bd"><span class="rt">${vn(it)} ${it.veg?'Veg':'Non-veg'}  ★ ${it.rating}</span><h2>${it.name}</h2><p>${it.desc}</p>
 <div class="pr"><span class="price">₹${it.price}</span>${ctl(it)}</div>
 ${q?`<div class="gap"></div><button class="btn p" data-go="cart">Go to cart · ₹${sub()}</button>`:''}</div>`}
function closeSheet(){sheetItem=null;$('#ov').classList.remove('on')}
function buildWA(){
 const s=sub(),d=coupon&&s>=MINO?OFF:0;
 const L=MENU.filter(m=>cart[m.id]).map(m=>`${cart[m.id]} x ${m.name} = ₹${cart[m.id]*m.price}`);
 const t=`*New order - ${BRAND}*\n\n${L.join('\n')}\n\nSubtotal: ₹${s}\n${d?`Offer BHUKKAD100: -₹${d}\n`:''}*Total: ₹${s-d}*\n\nName: ${me.name}\nPhone: ${me.phone}\nAddress: ${me.address}`;
 return `https://wa.me/${WA}?text=${encodeURIComponent(t)}`}

/* ---------- EVENTS ---------- */
document.addEventListener('click',e=>{
 const t=e.target;
 const inc=t.closest('[data-inc]'),dec=t.closest('[data-dec]');
 if(inc)return changeQty(inc.dataset.inc,1);
 if(dec)return changeQty(dec.dataset.dec,-1);
 if(t.closest('[data-close]')||t===$('#ov'))return closeSheet();
 const g=t.closest('[data-go]');if(g){closeSheet();return go(g.dataset.go)}
 const c=t.closest('[data-cat]');if(c){go('menu');const s=$('#sec-'+c.dataset.cat);if(s)s.scrollIntoView({behavior:'smooth'});return}
 const ch=t.closest('[data-chip]');if(ch){document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===ch));const s=$('#sec-'+ch.dataset.chip);if(s)s.scrollIntoView({behavior:'smooth'});return}
 const o=t.closest('[data-open]');if(o)return openItem(+o.dataset.open);
 if(t.closest('[data-apply]')){coupon=true;return go('cart')}
 if(t.closest('[data-unapply]')){coupon=false;readCartForm();return go('cart',false)}
 if(t.closest('[data-saveme]')){me.name=$('#pn').value.trim();me.phone=$('#pp').value.trim();me.address=$('#pa').value.trim();saveMe();go('profile',false);$('#perr').style.color='var(--veg)';$('#perr').textContent='Details saved.';return}
 const wa=t.closest('#wa');
 if(wa){readCartForm();const er=$('#err');
  if(!me.name||!/^[0-9+ ]{10,14}$/.test(me.phone)||!me.address){e.preventDefault();er.textContent='Enter your name, a 10-digit phone number and delivery address.';return}
  er.textContent='';wa.href=buildWA()}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeSheet();
 if(e.key==='Enter'){const o=e.target.closest&&e.target.closest('[data-open]');if(o&&e.target===o)openItem(+o.dataset.open)}
});
go('home');
</script>
</body>
</html>
